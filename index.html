<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio VFX Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow centered column like a link-in-bio page. Cover video, profile, vertical reels strip, project cards, tools, contact. */
:root{
  --bg:#FAFAF8;
  --card:#FFFFFF;
  --fg:#141414;
  --muted:#6E6E6A;
  --line:#E4E3DF;
  --btn:#141414;
  --btn-fg:#FAFAF8;
  --ph-a:#2A2B2D; --ph-b:#0E0F10;   /* placeholder frames stay dark in both themes */
  --f-sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F0F10;--card:#161617;--fg:#EDEDEA;--muted:#8F8F8A;--line:#28282A;--btn:#EDEDEA;--btn-fg:#121212;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F0F10;--card:#161617;--fg:#EDEDEA;--muted:#8F8F8A;--line:#28282A;--btn:#EDEDEA;--btn-fg:#121212;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.mono{font-family:var(--f-mono)}
.col{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* cover */
.cover{position:relative;height:clamp(200px,38vw,440px);overflow:hidden;background:var(--ph-b)}
.cover video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph{position:absolute;inset:0;background:
   radial-gradient(60% 80% at 30% 40%,#4A4C50 0,transparent 60%),
   radial-gradient(50% 70% at 75% 65%,#35373A 0,transparent 60%),
   linear-gradient(160deg,var(--ph-a),var(--ph-b));
   background-size:140% 140%;animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{from{background-position:0% 0%}to{background-position:100% 100%}}
@media (prefers-reduced-motion:reduce){.ph{animation:none}}
.ph-label{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;color:#D9D9D5;background:rgba(0,0,0,.45);padding:5px 10px;white-space:nowrap;text-transform:uppercase}

/* profile */
.profile{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;margin-top:-52px;position:relative}
.avatar{width:104px;height:104px;border-radius:50%;border:4px solid var(--bg);background:linear-gradient(150deg,#3A3B3E,#121314);display:grid;place-items:center;overflow:hidden;color:#EDEDEA;font-family:var(--f-mono);font-size:22px;letter-spacing:.06em}
.avatar img{width:100%;height:100%;object-fit:cover}
.name{font-size:28px;font-weight:700;letter-spacing:-.01em;margin:8px 0 0}
.role{font-family:var(--f-mono);color:var(--fg);font-size:14px;margin:0}
.tag{font-family:var(--f-mono);color:var(--muted);font-size:14px;margin:10px 0 0}
.socials{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;list-style:none;margin:14px 0 0;padding:0}
.socials a{display:inline-block;font-family:var(--f-mono);font-size:13px;text-decoration:none;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card)}
.socials a:hover{border-color:var(--fg)}

/* reels strip */
.reels-wrap{max-width:760px;margin:36px auto 0;position:relative;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.reels{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:none}
.reels::-webkit-scrollbar{display:none}
.reel{flex:0 0 clamp(120px,30vw,150px);aspect-ratio:9/16;position:relative;overflow:hidden;scroll-snap-align:start;background:linear-gradient(170deg,var(--ph-a),var(--ph-b));border-radius:4px}
.reel video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.reel span{position:absolute;left:8px;bottom:8px;font-family:var(--f-mono);font-size:11px;color:#E5E5E1;background:rgba(0,0,0,.5);padding:2px 6px}
.reel:nth-child(3n+2){background:linear-gradient(190deg,#3B3D41,#101112)}
.reel:nth-child(3n){background:linear-gradient(150deg,#1D1E20,#46484C)}
.nav-btn{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:0;background:rgba(20,20,20,.65);color:#fff;font-size:18px;cursor:pointer;display:grid;place-items:center;z-index:2}
.nav-btn.prev{left:max(4px,env(safe-area-inset-left,0px))}.nav-btn.next{right:max(4px,env(safe-area-inset-right,0px))}
@media (hover:none){.nav-btn{display:none}}

/* blocks */
.block{margin-top:40px;border:1px solid var(--line);background:var(--card)}
.block-head{text-align:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.block-head h2{margin:0;font-size:15px;font-weight:700;font-family:var(--f-mono);letter-spacing:.02em}
.block-head p{margin:2px 0 0;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.projects{display:flex;flex-direction:column;gap:12px;padding:12px}
.project{border:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:12px}
.shot{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:6px;overflow:hidden;background:linear-gradient(160deg,var(--ph-a),var(--ph-b))}
.shot img,.shot video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shot .ph-label{top:50%}
.project h3{margin:0;font-family:var(--f-mono);font-size:13.5px;font-weight:500}
.watch{display:block;text-align:center;text-decoration:none;background:var(--btn);color:var(--btn-fg);font-family:var(--f-mono);font-weight:500;font-size:13px;padding:9px 12px}
.watch:hover{opacity:.86}

/* tools */
.tools{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;list-style:none;margin:0;padding:18px 16px}
.tools li{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;padding:6px 12px 6px 6px;border:1px solid var(--line);border-radius:999px}
.tools b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--btn);color:var(--btn-fg);font-family:var(--f-mono);font-size:11px;font-weight:500}

/* contact */
.contact{margin-top:40px;padding-block:36px;text-align:center;border-top:1px solid var(--line)}
.contact h2{margin:0;font-size:clamp(30px,8vw,44px);font-weight:700;letter-spacing:-.02em;line-height:1.15}
.contact p{margin:6px 0 18px;color:var(--muted);font-family:var(--f-mono);font-size:13px}
.mail{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px}
.mail span{font-family:var(--f-mono);font-size:15px;user-select:all;overflow-wrap:anywhere}
.mail button{font-family:var(--f-mono);font-size:13px;padding:8px 14px;border:0;background:var(--btn);color:var(--btn-fg);cursor:pointer}
footer{text-align:center;font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-block:20px 32px}
</style>
</head>
<body>

<!-- ẢNH/VIDEO BÌA: đặt đường dẫn video trong biến COVER_VIDEO ở cuối file -->
<header class="cover" id="cover"></header>

<div class="col">
  <section class="profile">
    <div class="avatar" id="avatar">TB</div>
    <h1 class="name">Tên Của Bạn</h1>
    <p class="role">VFX Editor | Compositor</p>
    <p class="tag">plate → final</p>
    <ul class="socials">
      <li><a href="#" target="_blank" rel="noopener">Instagram</a></li>
      <li><a href="#" target="_blank" rel="noopener">YouTube</a></li>
      <li><a href="#" target="_blank" rel="noopener">TikTok</a></li>
      <li><a href="#" target="_blank" rel="noopener">Behance</a></li>
    </ul>
  </section>
</div>

<div class="reels-wrap">
  <button class="nav-btn prev" type="button" id="prevBtn" aria-label="Clip trước">‹</button>
  <div class="reels" id="reels"></div>
  <button class="nav-btn next" type="button" id="nextBtn" aria-label="Clip tiếp">›</button>
</div>

<main class="col">
  <section class="block">
    <div class="block-head"><h2>Dự án</h2><p>Những dự án gần đây</p></div>
    <div class="projects" id="projects"></div>
  </section>

  <section class="block">
    <div class="block-head"><h2>Phần mềm</h2><p>Công cụ mình dùng</p></div>
    <ul class="tools" id="tools"></ul>
  </section>

  <section class="contact">
    <h2>Liên hệ làm việc</h2>
    <p>MV · quảng cáo · phim ngắn</p>
    <div class="mail"><span id="mailAddr">email.cua.ban@gmail.com</span><button type="button" id="copyBtn">Sao chép</button></div>
  </section>
</main>

<footer>© 2026 Tên Của Bạn</footer>

<script>
/* =============== SỬA NỘI DUNG Ở ĐÂY =============== */
// Video bìa: tải file .mp4 lên GitHub rồi ghi tên file, ví dụ "cover.mp4"
const COVER_VIDEO = "";

// Ảnh đại diện: ví dụ "avatar.jpg" (để trống thì hiện chữ viết tắt)
const AVATAR = "";

// Dải clip dọc (9:16): video là tên file .mp4
const REELS = [
  {title:"Breakdown 01", video:""},
  {title:"Breakdown 02", video:""},
  {title:"Roto · Key",   video:""},
  {title:"Sky replace",  video:""},
  {title:"Clean-up",     video:""},
  {title:"Set extension",video:""}
];

// Dự án: image là ảnh thumbnail, link là link YouTube/Vimeo/Drive của clip
const PROJECTS = [
  {title:"Mưa Sao Băng | MV",            image:"", link:""},
  {title:"Ngã Ba Đèn Đỏ | Phim ngắn",     image:"", link:""},
  {title:"Hơi Thở Mới | Quảng cáo",       image:"", link:""},
  {title:"Thành Phố Ngủ Quên | VFX",      image:"", link:""}
];

// Phần mềm
const TOOLS = [
  ["Ae","After Effects"],
  ["Pr","Premiere Pro"],
  ["Dr","DaVinci Resolve"],
  ["Mo","Mocha Pro"],
  ["Bl","Blender"]
];
/* ================================================== */

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const vid = src => `<video src="${esc(src)}" autoplay muted loop playsinline></video>`;

document.getElementById('cover').innerHTML = COVER_VIDEO
  ? vid(COVER_VIDEO)
  : `<div class="ph"></div><span class="ph-label">Video bìa đặt ở đây</span>`;

if (AVATAR) document.getElementById('avatar').innerHTML = `<img src="${esc(AVATAR)}" alt="Ảnh đại diện">`;

document.getElementById('reels').innerHTML = REELS.map(r =>
  `<div class="reel">${r.video ? vid(r.video) : ''}<span>${esc(r.title)}</span></div>`).join('');

document.getElementById('projects').innerHTML = PROJECTS.map(p => `
  <article class="project">
    <div class="shot">${p.image ? `<img src="${esc(p.image)}" alt="${esc(p.title)}">` : `<span class="ph-label">Thumbnail</span>`}</div>
    <h3>${esc(p.title)}</h3>
    <a class="watch" href="${p.link ? esc(p.link) : '#'}" ${p.link ? 'target="_blank" rel="noopener"' : ''}>Xem ngay</a>
  </article>`).join('');

document.getElementById('tools').innerHTML = TOOLS.map(([c,n]) => `<li><b>${esc(c)}</b>${esc(n)}</li>`).join('');

const reels = document.getElementById('reels');
const step = () => (reels.firstElementChild?.getBoundingClientRect().width || 140) + 14;
document.getElementById('prevBtn').onclick = () => reels.scrollBy({left:-step()*2, behavior:'smooth'});
document.getElementById('nextBtn').onclick = () => reels.scrollBy({left: step()*2, behavior:'smooth'});

const copyBtn = document.getElementById('copyBtn'), mailEl = document.getElementById('mailAddr');
copyBtn.addEventListener('click', () => {
  const done = () => { copyBtn.textContent = 'Đã sao chép'; setTimeout(() => copyBtn.textContent = 'Sao chép', 1800); };
  const select = () => { const s = getSelection(), r = document.createRange(); r.selectNodeContents(mailEl); s.removeAllRanges(); s.addRange(r); };
  try { navigator.clipboard.writeText(mailEl.textContent.trim()).then(done, select); } catch(e){ select(); }
});
</script>
</body>
</html>
